<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Roborace Vision</title>
<style>html,body{margin:0;background:#0b0d12;color:#e8eaf0;font:15px -apple-system,system-ui,sans-serif}</style>
<script>
  // Stable shell for the camera debug page, like index.html: vision.js loads with a fresh ?t= so pushes show up at once.
  (function () {
    var t = Date.now();
    var css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = 'style.css?t=' + t;
    document.head.appendChild(css);
    var s = document.createElement('script');
    s.type = 'module';
    s.src = 'vision.js?t=' + t;
    document.head.appendChild(s);
  })();
</script>
</head>
<body></body>
</html>
